name: Database migrations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/database-migrations.yml"
      - "package-lock.json"
      - "package.json"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - "supabase/migrations/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/database-migrations.yml"
      - "package-lock.json"
      - "package.json"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - "supabase/migrations/**"

concurrency:
  group: database-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Apply migrations to a fresh local database
        run: npx supabase db start
        timeout-minutes: 20

  deploy:
    name: Apply migrations to production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Link production project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending migrations
        run: npx supabase db push --dry-run

      - name: Apply pending migrations
        run: npx supabase db push

      - name: Deploy Edge Functions
        run: |
          npx supabase functions deploy daily-digest --project-ref "$SUPABASE_PROJECT_ID"
          npx supabase functions deploy ai-material-draft --project-ref "$SUPABASE_PROJECT_ID"
