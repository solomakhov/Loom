name: Database migrations

on:
  pull_request:
    paths:
      - ".github/workflows/database-migrations.yml"
      - "package-lock.json"
      - "package.json"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - "supabase/migrations/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/database-migrations.yml"
      - "package-lock.json"
      - "package.json"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - "supabase/migrations/**"

concurrency:
  group: database-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate migrations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2

      - name: Apply migrations to a fresh local database
        run: supabase db start

  deploy:
    name: Apply migrations to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy daily-digest --project-ref "$SUPABASE_PROJECT_ID"
